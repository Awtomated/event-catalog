[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-event-catalog"
version = "0.1.0"
description = "Pluggable Django event catalog and workflow trigger system"
requires-python = ">=3.11"

[project.optional-dependencies]
# Install this in services that only emit events (e.g. drive-ms)
publisher = [
    "redis>=4.6",
]
# Install this in the service that owns triggers and runs the matcher (e.g. main-api)
full = [
    "django>=4.2",
    "celery>=5.3",
    "redis>=4.6",
    "djangorestframework>=3.14",
    "django-extensions>=3.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["event_catalog*"]
